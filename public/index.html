<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Perpustakaan Sederhana</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
  <div class="max-w-4xl mx-auto p-6">
    <header class="mb-8 text-center">
      <h1 class="text-3xl font-bold text-slate-900">📚 Sistem Perpustakaan Digital</h1>
      <p class="text-slate-600 mt-1">Kelola data koleksi buku perpustakaan dengan Node.js & Firestore</p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- Form Tambah Buku -->
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 md:col-span-1">
        <h2 class="text-lg font-semibold mb-4 text-slate-900">Tambah Buku Baru</h2>
        <form id="bookForm" class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Judul Buku</label>
            <input type="text" id="title" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Penulis / Pengarang</label>
            <input type="text" id="author" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">ISBN</label>
            <input type="text" id="isbn" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="978-xxxxxxxx">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Tahun Terbit</label>
            <input type="number" id="year" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" value="2026">
          </div>
          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg text-sm transition duration-150">Simpan Buku</button>
        </form>
      </div>

      <!-- Daftar Buku -->
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 md:col-span-2">
        <h2 class="text-lg font-semibold mb-4 text-slate-900">Daftar Buku Perpustakaan</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-sm">
            <thead>
              <tr class="border-b bg-slate-50 text-slate-600">
                <th class="p-3">Judul</th>
                <th class="p-3">Penulis</th>
                <th class="p-3">Tahun</th>
                <th class="p-3">Aksi</th>
              </tr>
            </thead>
            <tbody id="bookTableBody">
              <tr>
                <td colspan="4" class="text-center p-4 text-slate-500">Memuat data...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = '/api/books';

    async function fetchBooks() {
      const tbody = document.getElementById('bookTableBody');
      try {
        const res = await fetch(API_URL);
        // Kalau responsnya bukan JSON valid (misal 500 HTML dari Vercel), res.json() akan throw
        const text = await res.text();
        let result;
        try {
          result = JSON.parse(text);
        } catch (e) {
          throw new Error('Respons server bukan JSON (status ' + res.status + '): ' + text.slice(0, 300));
        }
        tbody.innerHTML = '';

        if (result && result.data && result.data.length > 0) {
          result.data.forEach(book => {
            const tr = document.createElement('tr');
            tr.className = 'border-b hover:bg-slate-50';
            tr.innerHTML = `
              <td class="p-3 font-medium text-slate-900">${book.title}</td>
              <td class="p-3 text-slate-600">${book.author}</td>
              <td class="p-3 text-slate-600">${book.year || '-'}</td>
              <td class="p-3">
                <button onclick="deleteBook('${book.id}')" class="text-red-600 hover:text-red-800 text-xs font-semibold">Hapus</button>
              </td>
            `;
            tbody.appendChild(tr);
          });
        } else {
          tbody.innerHTML = '<tr><td colspan="4" class="text-center p-4 text-slate-500">Belum ada koleksi buku.</td></tr>';
        }
      } catch (err) {
        console.error('Gagal memuat data buku:', err);
        tbody.innerHTML = `<tr><td colspan="4" class="text-center p-4 text-red-600">
          ❌ Gagal memuat data: ${err.message.replace(/</g, '&lt;')}<br>
          <span class="text-slate-500 text-xs">Cek tab Console untuk log lengkap.</span>
        </td></tr>`;
      }
    }

    document.getElementById('bookForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value;
      const author = document.getElementById('author').value;
      const isbn = document.getElementById('isbn').value;
      const year = document.getElementById('year').value;

      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, author, isbn, year })
      });

      document.getElementById('bookForm').reset();
      fetchBooks();
    });

    async function deleteBook(id) {
      if (confirm('Yakin ingin menghapus buku ini?')) {
        await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
        fetchBooks();
      }
    }

    fetchBooks();
  </script>
</body>
</html>
